<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>BANDAR80 - Prediksi Bola</title>
<link rel="icon" href="https://bandar71.com/favicon.ico" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
html, body {
    margin: 0;
    padding: 0;
    background: #000000;
}
#bandar80-root .ibc-loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:320px;gap:14px;font-family:'Poppins',sans-serif;background:#000000;border-radius:12px;padding:30px 20px;}
#bandar80-root .ibc-spinner{width:46px;height:46px;border:4px solid #29A8E033;border-top-color:#29A8E0;border-radius:50%;animation:ibcSpin .7s linear infinite;}
@keyframes ibcSpin{to{transform:rotate(360deg)}}
#bandar80-root .ibc-loading-text{color:#29A8E0;font-size:13px;font-weight:700;letter-spacing:1.5px;text-shadow:0 0 10px #29A8E080;text-align:center;}
#bandar80-root .ibc-loading-sub{color:#29A8E080;font-size:10px;letter-spacing:1px;text-align:center;margin-top:-8px;}
</style>
</head>
<body>

<div id="bandar80-root">
    <div class="ibc-loading-wrap">
        <div class="ibc-spinner"></div>
        <div class="ibc-loading-text">MEMUAT PREDIKSI...</div>
        <div class="ibc-loading-sub">BANDAR80</div>
    </div>
</div>

<script src="https://shortcutpro.github.io/bolaauto/logo-db-0.js"></script>

<script>
/* Kirim tinggi konten ke halaman induk (opsional) */
(function () {
    var lastH = 0;
    function sendHeight() {
        var h = Math.max(
            document.body.scrollHeight,
            document.documentElement.scrollHeight
        );
        if (h !== lastH) {
            lastH = h;
            try { parent.postMessage({ ziaEmbedHeight: h }, '*'); } catch (e) {}
        }
    }
    setInterval(sendHeight, 800);
    window.addEventListener('load', sendHeight);
})();
</script>
