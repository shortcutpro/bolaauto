<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>MANCING DUIT - Prediksi Bola</title>
<link rel="icon" href="https://cdn.areabermain.club/assets/cdn/az5/2026/09/16/20260916/710b5546b38d761c24f131f706426431/logo.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
html, body {
    margin: 0;
    padding: 0;
    background: #000000;
}
#mancingduit-root .ibc-loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:320px;gap:14px;font-family:'Poppins',sans-serif;background:#000000;border-radius:12px;padding:30px 20px;}
#mancingduit-root .ibc-spinner{width:46px;height:46px;border:4px solid #29B6E833;border-top-color:#29B6E8;border-radius:50%;animation:ibcSpin .7s linear infinite;}
@keyframes ibcSpin{to{transform:rotate(360deg)}}
#mancingduit-root .ibc-loading-text{color:#29B6E8;font-size:13px;font-weight:700;letter-spacing:1.5px;text-shadow:0 0 10px #29B6E880;text-align:center;}
#mancingduit-root .ibc-loading-sub{color:#29B6E880;font-size:10px;letter-spacing:1px;text-align:center;margin-top:-8px;}
#mancingduit-root .ibc-progress-wrap{width:80%;max-width:320px;margin-top:2px;}
#mancingduit-root .ibc-progress-track{width:100%;height:10px;background:rgba(255,255,255,0.06);border-radius:8px;overflow:hidden;border:1px solid #29B6E826;position:relative;}
#mancingduit-root .ibc-progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#0d5a78,#29B6E8,#8fe0ff);border-radius:8px;transition:width .4s ease;box-shadow:0 0 12px #29B6E866,inset 0 1px 0 rgba(255,255,255,0.25);}
#mancingduit-root .ibc-progress-pct{color:#29B6E8;font-size:12px;font-weight:700;letter-spacing:1px;text-align:center;margin-top:6px;text-shadow:0 0 8px #29B6E860;}
</style>
</head>
<body>

<div id="mancingduit-root">
    <div class="ibc-loading-wrap">
        <div class="ibc-spinner"></div>
        <div class="ibc-loading-text">MEMUAT PREDIKSI...</div>
        <div class="ibc-loading-sub">MANCING DUIT</div>
    </div>
</div>

<script>
/* Kirim tinggi konten ke halaman induk (opsional) */
(function () {
    var lastH = 0;
    function sendHeight() {
        var h = Math.max(
            document.body.scrollHeight,
            document.documentElement.scrollHeight
        );
        if (h !== lastH) {
            lastH = h;
            try { parent.postMessage({ ziaEmbedHeight: h }, '*'); } catch (e) {}
        }
    }
    setInterval(sendHeight, 800);
    window.addEventListener('load', sendHeight);
})();
</script>
